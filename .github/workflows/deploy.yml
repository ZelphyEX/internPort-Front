name: Build and Deploy to Cloud Run

# Deploy on every push to main.
on:
  push:
    branches: [main]

# Values you must set. Repository -> Settings -> Secrets and variables -> Actions.
#
# Variables (Variables tab):
#   GCP_PROJECT_ID         e.g. my-project-123456
#   GCP_REGION             e.g. asia-southeast1
#   AR_REPOSITORY          Artifact Registry repo name, e.g. gimasys-intern-portal
#   CLOUD_RUN_SERVICE      Cloud Run service name, e.g. gimasys-intern-portal
#   WIF_SERVICE_ACCOUNT    deployer SA email, e.g. gh-deployer@my-project.iam.gserviceaccount.com
#   VITE_API_BASE_URL      Base URL of the FastAPI backend, e.g. https://<backend>/api/v1.
#                          Not secret, but baked into the client bundle at BUILD time (Vite),
#                          so it's passed as a docker build-arg, not just a runtime env var.
#   VITE_GOOGLE_CLIENT_ID  GCP OAuth 2.0 Web client id, e.g. <id>.apps.googleusercontent.com.
#                          Also baked in at BUILD time. Google Sign-In is the ONLY way to log
#                          in, so a missing value means nobody can enter the portal. The
#                          backend needs the SAME client id in its own GOOGLE_CLIENT_ID env,
#                          otherwise it rejects every ID token this frontend produces.
#   VITE_ADMIN_LOGIN_EMAIL (optional) email prefilled in the "Đăng nhập Quản trị viên" box.
#                          Defaults to admin@gimasys.com. Keep it equal to the backend's
#                          BOOTSTRAP_ADMIN_EMAIL.
#
# Secrets (Secrets tab):
#   WIF_PROVIDER           full Workload Identity provider resource name:
#     projects/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>
#   GEMINI_API_KEY         Gemini API key, forwarded to the running Cloud Run service so
#                          /api/ai/* routes work in production (see server.ts).
#
# One-time GCP setup (run locally with gcloud), summarized:
#   1. Enable APIs: run.googleapis.com, artifactregistry.googleapis.com, iamcredentials.googleapis.com
#   2. Create the Artifact Registry docker repo (AR_REPOSITORY) in GCP_REGION.
#   3. Create a Workload Identity Pool + provider bound to this GitHub repo.
#   4. Create the deployer service account (WIF_SERVICE_ACCOUNT) with roles:
#        roles/run.admin, roles/artifactregistry.writer, roles/iam.serviceAccountUser
#   5. Allow the WIF principal to impersonate that SA.

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Required for Workload Identity Federation (keyless auth).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail sớm khi thiếu/sai cấu hình. Quan trọng nhất: VITE_API_BASE_URL được Vite
      # "nướng" vào bundle client lúc BUILD. Nếu nó rỗng, image vẫn build và deploy
      # thành công nhưng client rơi về fallback same-origin "/api/v1" -> gọi vào chính
      # service frontend này -> Express trả index.html (HTTP 200, HTML) -> client parse
      # HTML thành JSON và báo "Unexpected token '<'". Chặn ngay ở đây thay vì để
      # phát hiện trên production.
      - name: Validate required secrets/vars
        env:
          API_BASE: ${{ vars.VITE_API_BASE_URL }}
        run: |
          missing=()
          [ -z "${{ vars.GCP_PROJECT_ID }}" ] && missing+=("vars.GCP_PROJECT_ID")
          [ -z "${{ vars.GCP_REGION }}" ] && missing+=("vars.GCP_REGION")
          [ -z "${{ vars.AR_REPOSITORY }}" ] && missing+=("vars.AR_REPOSITORY")
          [ -z "${{ vars.CLOUD_RUN_SERVICE }}" ] && missing+=("vars.CLOUD_RUN_SERVICE")
          [ -z "${{ vars.WIF_SERVICE_ACCOUNT }}" ] && missing+=("vars.WIF_SERVICE_ACCOUNT")
          [ -z "${{ secrets.WIF_PROVIDER }}" ] && missing+=("secrets.WIF_PROVIDER")
          [ -z "$API_BASE" ] && missing+=("vars.VITE_API_BASE_URL")
          [ -z "${{ vars.VITE_GOOGLE_CLIENT_ID }}" ] && missing+=("vars.VITE_GOOGLE_CLIENT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub secrets/variables: ${missing[*]}. Set them in Settings > Secrets and variables > Actions. NOTE: VITE_API_BASE_URL must be in the *Variables* tab (it is read via vars.*, not secrets.*)."
            exit 1
          fi
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::VITE_API_BASE_URL must start with https:// (got '$API_BASE'). The site is served over HTTPS, so an http:// API URL is blocked by the browser as mixed content."; exit 1 ;;
          esac
          case "$API_BASE" in
            */api/v1|*/api/v1/) ;;
            *) echo "::error::VITE_API_BASE_URL must end with /api/v1 (got '$API_BASE'). The client appends paths like /auth/login straight onto it, so a missing prefix makes every request 404."; exit 1 ;;
          esac
          echo "Frontend will call API at: $API_BASE"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.VITE_GOOGLE_CLIENT_ID }}" \
            --build-arg VITE_ADMIN_LOGIN_EMAIL="${{ vars.VITE_ADMIN_LOGIN_EMAIL }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # Đây là site công khai: thiếu --allow-unauthenticated thì service mới tạo sẽ
          # đòi xác thực IAM và trình duyệt nhận trang 403 Forbidden. Container nghe $PORT.
          flags: >-
            --allow-unauthenticated
            --port=8080
          env_vars: |
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Show deployed URL
        run: |
          gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)'
